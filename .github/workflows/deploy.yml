name: Deploy to Azure

on:
  push:
    branches: [feature/backend]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: studiorags-group1
  SITE_URL: https://studiorags-group1-aff0fse5eranhvgf.eastasia-01.azurewebsites.net

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node (for the React pages)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the React pages
        working-directory: frontend
        run: |
          npm ci
          npm run build
        env:
          VITE_API_URL: ${{ env.SITE_URL }}

      - name: Put the React pages inside the backend
        run: |
          mkdir -p backend/wwwroot
          cp -r frontend/dist/* backend/wwwroot/

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build the backend
        run: dotnet publish backend/StudioRags.API.csproj -c Release -o publish

      - name: Publish to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: publish
